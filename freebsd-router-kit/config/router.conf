# Configuracao central do roteador FreeBSD.
# Edite este arquivo antes de executar configure.sh.
# Sintaxe: shell POSIX. Nao use espacos ao redor do sinal '='.

# Interfaces: confirme os nomes com: ifconfig
# No UTM/virtio podem aparecer como vtnet0/vtnet1; em hardware, em0/igb0/etc.
WAN_IF="vtnet0"
LAN_IF="vtnet1"

# WAN pode receber IP por DHCP ou usar endereco estatico.
# Para o laboratorio fisico, use o modo/endereco informado pelo professor.
WAN_MODE="static"                 # static | dhcp
WAN_STATIC_ADDRESS="192.168.50.10"
WAN_PREFIX="24"
WAN_GATEWAY="192.168.50.1"

# Rede privada da atividade: 10.0.0.0/16 (faixa RFC 1918).
LAN_ADDRESS="10.0.0.1"
LAN_NETWORK="10.0.0.0"
LAN_PREFIX="16"

# DHCP: reserva fora do pool dinamico.
DHCP_POOL_START="10.0.0.100"
DHCP_POOL_END="10.0.255.200"
DHCP_RESERVED_MAC="02:00:00:00:00:10"  # substitua pelo MAC real do cliente reservado
DHCP_RESERVED_IP="10.0.0.10"
DHCP_LEASE_TIME="43200"

# DNS fornecido pelo laboratorio/professor.
# Alternativas do enunciado: 192.168.X.1, 164.41.101.4 ou 164.41.101.11.
DNS_SERVER="164.41.101.4"

# Cliente LAN que recebera conexoes DNAT TCP/80 -> TCP/8080.
# Por simplicidade, deve ser o mesmo IP reservado acima.
WEB_SERVER_IP="10.0.0.10"

# Enderecos usados pelos scripts de teste. Ajuste conforme a topologia.
# WAN_TEST_SERVER_IP e outro computador conectado a rede WAN.
WAN_TEST_SERVER_IP="192.168.50.2"
# IP WAN atual do roteador; em WAN_MODE=dhcp, atualize depois de obter o lease.
ROUTER_WAN_TEST_IP="192.168.50.10"
